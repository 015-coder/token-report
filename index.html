<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本丸日報作成・管理ツール</title>
  <style>
    :root {
      --bg-color: #f7f4ef;        /* 落ち着いた生成り（和紙風）背景 */
      --card-bg: #ffffff;
      --accent-color: #8c1d40;    /* 臙脂（えんじ）色 */
      --accent-hover: #6a132f;
      --primary-blue: #2b4b6f;    /* 藍色 */
      --primary-blue-hover: #1e354f;
      --gold-color: #c5a059;      /* 黄金・金茶色 */
      --leader-bg: #fdfaf2;       /* 部隊長欄専用のうすい黄金・生成り背景 */
      --leader-border: #d4b87a;   /* 部隊長欄の枠線 */
      --border-color: #dcd6cd;    /* 伝統色風の枠線 */
      --text-color: #2b2b2b;
      --sub-text: #665d52;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .main-wrapper {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(43, 75, 111, 0.05);
      padding: 20px;
      box-sizing: border-box;
      height: fit-content;
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      color: var(--accent-color);
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--gold-color);
      padding-bottom: 8px;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-top: 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.88rem;
      color: var(--sub-text);
    }

    .section-title {
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 18px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      border-left: 4px solid var(--gold-color);
      padding-left: 8px;
      letter-spacing: 1px;
    }

    input[type="date"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
      box-sizing: border-box;
      background-color: #faf9f6;
      color: var(--text-color);
      transition: border-color 0.2s, background-color 0.2s;
    }

    /* 部隊長（リーダー）専用のスタイル：背景色と枠線に金茶色系統を採用 */
    input[type="text"].unit-leader {
      background-color: var(--leader-bg);
      border-color: var(--leader-border);
    }
    input[type="text"].unit-leader:focus {
      border-color: var(--gold-color);
      background-color: #ffffff;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      background-color: #ffffff;
    }

    .two-cols {
      display: flex;
      gap: 8px;
    }

    .two-cols input, .two-cols select {
      flex: 1;
    }

    .select-pair {
      display: flex;
      gap: 4px;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    textarea {
      resize: vertical;
      min-height: 50px;
    }

    .btn-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 0.92rem;
      font-weight: bold;
      color: #fff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button.secondary {
      background-color: #6c757d;
    }

    button.secondary:hover {
      background-color: #5a6268;
    }

    button.info {
      background-color: var(--primary-blue);
    }

    button.info:hover {
      background-color: var(--primary-blue-hover);
    }

    button.danger {
      background-color: #a94442;
    }

    button.danger:hover {
      background-color: #843534;
    }

    .preview-box {
      margin-top: 16px;
      background: #faf9f6;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      padding: 12px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 250px;
      overflow-y: auto;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .history-item {
      background: #faf9f6;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .history-info {
      overflow: hidden;
      cursor: pointer;
      flex: 1;
    }

    .history-info:hover .history-date {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .history-date {
      font-weight: bold;
      font-size: 0.9rem;
    }

    .history-summary {
      font-size: 0.8rem;
      color: var(--sub-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-actions {
      display: flex;
      gap: 4px;
    }

    .history-actions button {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    .backup-section {
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(43, 75, 111, 0.9);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
