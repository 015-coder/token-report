<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本丸日報作成・管理ツール</title>
  <style>
    :root {
      --bg-color: #f7f4ef;        /* 落ち着いた生成り（和紙風）背景 */
      --card-bg: #ffffff;
      --accent-color: #8c1d40;    /* 臙脂（えんじ）色 */
      --accent-hover: #6a132f;
      --primary-blue: #2b4b6f;    /* 藍色 */
      --primary-blue-hover: #1e354f;
      --gold-color: #c5a059;      /* 黄金・金茶色 */
      --border-color: #dcd6cd;    /* 伝統色風の枠線 */
      --text-color: #2b2b2b;
      --sub-text: #665d52;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .main-wrapper {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(43, 75, 111, 0.05);
      padding: 20px;
      box-sizing: border-box;
      height: fit-content;
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      color: var(--accent-color);
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--gold-color);
      padding-bottom: 8px;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-top: 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.88rem;
      color: var(--sub-text);
    }

    .section-title {
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 18px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      border-left: 4px solid var(--gold-color);
      padding-left: 8px;
      letter-spacing: 1px;
    }

    input[type="date"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
      box-sizing: border-box;
      background-color: #faf9f6;
      color: var(--text-color);
      transition: border-color 0.2s, background-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      background-color: #ffffff;
    }

    .two-cols {
      display: flex;
      gap: 8px;
    }

    .two-cols input, .two-cols select {
      flex: 1;
    }

    .select-pair {
      display: flex;
      gap: 4px;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    textarea {
      resize: vertical;
      min-height: 50px;
    }

    .btn-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 0.92rem;
      font-weight: bold;
      color: #fff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button.secondary {
      background-color: #6c757d;
    }

    button.secondary:hover {
      background-color: #5a6268;
    }

    button.info {
      background-color: var(--primary-blue);
    }

    button.info:hover {
      background-color: var(--primary-blue-hover);
    }

    button.danger {
      background-color: #a94442;
    }

    button.danger:hover {
      background-color: #843534;
    }

    .preview-box {
      margin-top: 16px;
      background: #faf9f6;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      padding: 12px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 250px;
      overflow-y: auto;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .history-item {
      background: #faf9f6;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .history-info {
      overflow: hidden;
      cursor: pointer;
      flex: 1;
    }

    .history-info:hover .history-date {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .history-date {
      font-weight: bold;
      font-size: 0.9rem;
    }

    .history-summary {
      font-size: 0.8rem;
      color: var(--sub-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-actions {
      display: flex;
      gap: 4px;
    }

    .history-actions button {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    .backup-section {
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(43, 75, 111, 0.9);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <script>
    let currentEditId = null; // 編集中の日報ID（新規の場合はnull）

    // 初期化
    document.addEventListener('DOMContentLoaded', () => {
      setToday();
      loadHistory();
      updatePreview();
    });

    function setToday() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;
    }

    // 入力変更時にプレビューを更新
    document.addEventListener('input', (e) => {
      if (e.target.matches('input, select, textarea')) {
        updatePreview();
      }
    });

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      return `${parts[0]}.${parts[1]}.${parts[2]}`;
    }

    // 部隊の入力値を取得
    function getUnitValues(unitClass) {
      const inputs = document.querySelectorAll(`.${unitClass}`);
      return Array.from(inputs).map(input => input.value);
    }

    // 部隊の入力値を設定
    function setUnitValues(unitClass, valuesArray) {
      const inputs = document.querySelectorAll(`.${unitClass}`);
      inputs.forEach((input, index) => {
        input.value = (valuesArray && valuesArray[index]) ? valuesArray[index] : '';
      });
    }

    function getFormData() {
      return {
        id: currentEditId || 'report_' + Date.now(),
        date: document.getElementById('date').value,
        kinji: document.getElementById('kinji').value,
        units: {
          u1: getUnitValues('unit1'),
          u2: getUnitValues('unit2'),
          u3: getUnitValues('unit3'),
          u4: getUnitValues('unit4'),
          u5: getUnitValues('unit5')
        },
        expedition: {
          e1Type: document.getElementById('exp-type-1').value,
          e1Unit: document.getElementById('exp-unit-1').value,
          e2Type: document.getElementById('exp-type-2').value,
          e2Unit: document.getElementById('exp-unit-2').value,
          e3Type: document.getElementById('exp-type-3').value,
          e3Unit: document.getElementById('exp-unit-3').value,
          e4Type: document.getElementById('exp-type-4').value,
          e4Unit: document.getElementById('exp-unit-4').value,
        },
        uma1: document.getElementById('uma1').value,
        uma2: document.getElementById('uma2').value,
        hata1: document.getElementById('hata1').value,
        hata2: document.getElementById('hata2').value,
        teawase1: document.getElementById('teawase1').value,
        teawase2: document.getElementById('teawase2').value,
        event: document.getElementById('event').value,
        goal: document.getElementById('goal').value,
        notes: document.getElementById('notes').value,
        updatedAt: new Date().toLocaleString()
      };
    }

    function generateReportText(data) {
      const formattedDate = formatDate(data.date);
      let text = `【本丸日報】\n`;
      text += `■ 日付：${formattedDate}\n`;
      text += `■ 近侍：${data.kinji}\n\n`;

      // 部隊編成テキスト生成
      let unitText = '';
      for (let i = 1; i <= 5; i++) {
        const uKey = `u${i}`;
        const members = data.units && data.units[uKey] ? data.units[uKey].filter(m => m.trim() !== '') : [];
        if (members.length > 0) {
          unitText += `・第${i}部隊：${members.join(' / ')}\n`;
        }
      }
      if (unitText) {
        text += `■ 部隊編成\n${unitText}\n`;
      }

      // 遠征テキスト生成
      let enseiText = '';
      if (data.expedition) {
        for (let i = 1; i <= 4; i++) {
          const type = data.expedition[`e${i}Type`];
          const unit = data.expedition[`e${i}Unit`];
          if (type || unit) {
            enseiText += `・遠征${i}：${type || '未選択'}（${unit || '未選択'}）\n`;
          }
        }
      }
      if (enseiText) {
        text += `■ 遠征\n${enseiText}\n`;
      }

      text += `■ 内番\n`;
      text += `・馬番：${data.uma1}${data.uma1 && data.uma2 ? ' / ' : ''}${data.uma2}\n`;
      text += `・畑番：${data.hata1}${data.hata1 && data.hata2 ? ' / ' : ''}${data.hata2}\n`;
      text += `・手合わせ：${data.teawase1}${data.teawase1 && data.teawase2 ? ' / ' : ''}${data.teawase2}\n\n`;

      text += `■ イベント\n${data.event}\n\n`;
      text += `■ 目標\n${data.goal}\n\n`;
      text += `■ 特記事項\n${data.notes}`;

      return text;
    }

    function updatePreview() {
      const data = getFormData();
      document.getElementById('preview').textContent = generateReportText(data);
    }

    function getAllReports() {
      const data = localStorage.getItem('touken_reports');
      return data ? JSON.parse(data) : {};
    }

    // 前日のデータからコピーする機能
    function copyFromPrevDay() {
      const currentDateVal = document.getElementById('date').value;
      if (!currentDateVal) {
        alert('日付を選択してください。');
        return;
      }

      const currentDate = new Date(currentDateVal);
      currentDate.setDate(currentDate.getDate() - 1);
      const yyyy = currentDate.getFullYear();
      const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
      const dd = String(currentDate.getDate()).padStart(2, '0');
      const prevDateStr = `${yyyy}-${mm}-${dd}`;

      const reports = getAllReports();
      const prevReportKey = Object.keys(reports).find(key => reports[key].date === prevDateStr);

      if (!prevReportKey) {
        alert(`前日 (${prevDateStr}) の保存データが見つかりませんでした。`);
        return;
      }

      const prevReport = reports[prevReportKey];

      document.getElementById('kinji').value = prevReport.kinji || '';
      
      if (prevReport.units) {
        setUnitValues('unit1', prevReport.units.u1);
        setUnitValues('unit2', prevReport.units.u2);
        setUnitValues('unit3', prevReport.units.u3);
        setUnitValues('unit4', prevReport.units.u4);
        setUnitValues('unit5', prevReport.units.u5);
      }

      if (prevReport.expedition) {
        for (let i = 1; i <= 4; i++) {
          document.getElementById(`exp-type-${i}`).value = prevReport.expedition[`e${i}Type`] || '';
          document.getElementById(`exp-unit-${i}`).value = prevReport.expedition[`e${i}Unit`] || '';
        }
      }

      document.getElementById('uma1').value = prevReport.uma1 || '';
      document.getElementById('uma2').value = prevReport.uma2 || '';
      document.getElementById('hata1').value = prevReport.hata1 || '';
      document.getElementById('hata2').value = prevReport.hata2 || '';
      document.getElementById('teawase1').value = prevReport.teawase1 || '';
      document.getElementById('teawase2').value = prevReport.teawase2 || '';

      updatePreview();
      showToast('前日のデータを読み込みました');
    }

    function saveReport() {
      const data = getFormData();
      if (!data.date) {
        alert('日付を入力してください。');
        return;
      }

      const reports = getAllReports();
      reports[data.id] = data;
      localStorage.setItem('touken_reports', JSON.stringify(reports));

      showToast('保存しました！');
      loadHistory();
      
      navigator.clipboard.writeText(generateReportText(data)).catch(() => {});
    }

    function loadHistory() {
      const reports = getAllReports();
      const listContainer = document.getElementById('historyList');
      listContainer.innerHTML = '';

      const sortedIds = Object.keys(reports).sort((a, b) => {
        return reports[b].date.localeCompare(reports[a].date);
      });

      if (sortedIds.length === 0) {
        listContainer.innerHTML = '<div style="color: var(--sub-text); font-size: 0.85rem; text-align: center; padding: 20px;">保存された日報はありません</div>';
        return;
      }

      sortedIds.forEach(id => {
        const report = reports[id];
        const item = document.createElement('div');
        item.className = 'history-item';
        
        item.innerHTML = `
          <div class="history-info" onclick="editReport('${id}')">
            <div class="history-date">${formatDate(report.date)} (近侍: ${report.kinji || '未設定'})</div>
            <div class="history-summary">イベント: ${report.event || 'なし'}</div>
          </div>
          <div class="history-actions">
            <button onclick="copySpecific('${id}')">コピー</button>
            <button class="danger" onclick="deleteReport('${id}')">削除</button>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function editReport(id) {
      const reports = getAllReports();
      const report = reports[id];
      if (!report) return;

      currentEditId = report.id;
      document.getElementById('date').value = report.date || '';
      document.getElementById('kinji').value = report.kinji || '';

      if (report.units) {
        setUnitValues('unit1', report.units.u1);
        setUnitValues('unit2', report.units.u2);
        setUnitValues('unit3', report.units.u3);
        setUnitValues('unit4', report.units.u4);
        setUnitValues('unit5', report.units.u5);
      } else {
        setUnitValues('unit1', []); setUnitValues('unit2', []); setUnitValues('unit3', []); setUnitValues('unit4', []); setUnitValues('unit5', []);
      }

      if (report.expedition) {
        for (let i = 1; i <= 4; i++) {
          document.getElementById(`exp-type-${i}`).value = report.expedition[`e${i}Type`] || '';
          document.getElementById(`exp-unit-${i}`).value = report.expedition[`e${i}Unit`] || '';
        }
      } else {
        for (let i = 1; i <= 4; i++) {
          document.getElementById(`exp-type-${i}`).value = '';
          document.getElementById(`exp-unit-${i}`).value = '';
        }
      }

      document.getElementById('uma1').value = report.uma1 || '';
      document.getElementById('uma2').value = report.uma2 || '';
      document.getElementById('hata1').value = report.hata1 || '';
      document.getElementById('hata2').value = report.hata2 || '';
      document.getElementById('teawase1').value = report.teawase1 || '';
      document.getElementById('teawase2').value = report.teawase2 || '';
      document.getElementById('event').value = report.event || '';
      document.getElementById('goal').value = report.goal || '';
      document.getElementById('notes').value = report.notes || '';

      updatePreview();
      showToast('編集モード：保存すると上書きされます');
    }

    function copySpecific(id) {
      const reports = getAllReports();
      const report = reports[id];
      if (!report) return;

      const text = generateReportText(report);
      navigator.clipboard.writeText(text).then(() => {
        showToast('コピーしました！');
      });
    }

    function deleteReport(id) {
      if (confirm('この日報データを削除しますか？')) {
        const reports = getAllReports();
        delete reports[id];
        localStorage.setItem('touken_reports', JSON.stringify(reports));
        loadHistory();
        showToast('削除しました');
      }
    }

    function copyToClipboard() {
      const data = getFormData();
      const text = generateReportText(data);
      navigator.clipboard.writeText(text).then(() => {
        showToast('コピーしました！');
      });
    }

    function resetForm() {
      if (confirm('入力内容をクリアして新規作成モードにしますか？')) {
        currentEditId = null;
        setToday();
        document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = '');
        for (let i = 1; i <= 4; i++) {
          document.getElementById(`exp-type-${i}`).value = '';
          document.getElementById(`exp-unit-${i}`).value = '';
        }
        updatePreview();
      }
    }

    function exportData() {
      const reports = localStorage.getItem('touken_reports') || '{}';
      const blob = new Blob([reports], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `touken_reports_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('バックアップを出力しました');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (typeof imported === 'object') {
            localStorage.setItem('touken_reports', JSON.stringify(imported));
            loadHistory();
            showToast('データを読み込みました');
          } else {
            alert('ファイルの形式が正しくありません。');
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
  </script>
